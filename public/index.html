<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BackgroundStudio</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e8a24a' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='3' width='18' height='18' rx='2'/><circle cx='9' cy='9' r='2'/><path d='m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21'/></svg>" />
<link rel="stylesheet" href="styles.css" />

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand"><span id="brandIcon"></span> BackgroundStudio <span class="badge">v0.1</span></div>
    <div class="topbar-status">
      <span id="keyPill" class="pill">checking…</span>
      <span class="pill cost">session <span class="num" id="sessionCost">$0.0000</span></span>
    </div>
  </div>
</header>

<main class="wrap">
  <!-- Compose -->
  <section class="panel" id="composePanel">
    <div id="modeBanner" class="mode-banner" hidden></div>

    <div class="field">
      <p class="microlabel" id="promptLabel">Prompt</p>
      <textarea id="prompt" placeholder="Describe the background… e.g. moody neon-lit rain-soaked city street at night, cinematic, wide"></textarea>
    </div>

    <!-- Base image (adjust mode) -->
    <div class="field" id="baseField" hidden>
      <p class="microlabel active">Base image</p>
      <div class="base-slot" id="baseSlot"></div>
    </div>

    <!-- Reference / object uploads -->
    <div class="field">
      <p class="microlabel" id="uploadLabel">Reference images</p>
      <div class="dropzone" id="dropzone" tabindex="0">
        <span id="dropText">Drop images here, or click to choose — used as visual references</span>
        <input type="file" id="fileInput" accept="image/*" multiple hidden />
      </div>
      <div class="thumbs" id="thumbs"></div>
    </div>

    <div class="controls-row">
      <div class="control">
        <p class="microlabel">Aspect ratio</p>
        <div class="chips" id="aspectChips"></div>
      </div>
      <div class="control">
        <p class="microlabel">Resolution</p>
        <div class="chips" id="resChips"></div>
      </div>
      <div class="control">
        <p class="microlabel">Keying</p>
        <div class="chips"><button class="chip" id="keyingChip" type="button"></button></div>
      </div>
    </div>

    <div class="actionbar">
      <button class="btn" id="clearBtn" type="button" hidden>Cancel adjust</button>
      <button class="btn primary" id="goBtn" type="button"><span id="goLabel">Generate</span></button>
    </div>
  </section>

  <!-- Library -->
  <section class="panel">
    <div class="lib-head">
      <span id="libIcon"></span>
      <h2 class="section-title" style="margin:0">Library</h2>
      <span class="lib-count" id="libCount"></span>
    </div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="libEmpty" hidden>No backgrounds yet. Generate your first one above.</div>
  </section>
</main>

<div class="lightbox" id="lightbox" hidden>
  <button class="close" id="lightboxClose" type="button">✕</button>
  <img id="lightboxImg" alt="" />
</div>

<script src="app.js"></script>
